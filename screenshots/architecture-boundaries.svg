<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
  <title id="title">Triscaler data boundaries</title>
  <desc id="desc">The endpoint performs local evaluation. A reporting-policy gate controls which findings are sent to the central analyst console.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#8794a7"/>
    </marker>
  </defs>
  <rect width="1280" height="460" fill="#f7f9fc"/>
  <text x="40" y="46" fill="#084da8" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">DATA BOUNDARY</text>
  <text x="40" y="86" fill="#0d1526" font-family="Arial,sans-serif" font-size="29" font-weight="700">Local discovery. Deliberate reporting.</text>
  <text x="40" y="116" fill="#5b6678" font-family="Arial,sans-serif" font-size="16">A finding crosses the boundary only when reporting policy allows it.</text>

  <rect x="40" y="150" width="500" height="220" rx="8" fill="#eef5ff" stroke="#d5e5fb"/>
  <rect x="740" y="150" width="500" height="220" rx="8" fill="#eef8f5" stroke="#d5e9e2"/>
  <g font-family="Arial,sans-serif">
    <text x="68" y="184" fill="#084da8" font-size="11" font-weight="700" letter-spacing="1.5">ON THE MAC</text>
    <text x="68" y="216" fill="#0d1526" font-size="21" font-weight="700">Local analysis and report</text>
    <circle cx="72" cy="252" r="4" fill="#0b75ff"/><text x="88" y="257" fill="#374356" font-size="15">Supported content checked on device</text>
    <circle cx="72" cy="286" r="4" fill="#0b75ff"/><text x="88" y="291" fill="#374356" font-size="15">Browser warning text stays in the local flow</text>
    <circle cx="72" cy="320" r="4" fill="#0b75ff"/><text x="88" y="325" fill="#374356" font-size="15">Findings and scan state remain available locally</text>

    <text x="768" y="184" fill="#087c69" font-size="11" font-weight="700" letter-spacing="1.5">CENTRAL CONSOLE</text>
    <text x="768" y="216" fill="#0d1526" font-size="21" font-weight="700">Investigation and response</text>
    <circle cx="772" cy="252" r="4" fill="#13a58b"/><text x="788" y="257" fill="#374356" font-size="15">Policy-approved finding reports</text>
    <circle cx="772" cy="286" r="4" fill="#13a58b"/><text x="788" y="291" fill="#374356" font-size="15">Location, account and lifecycle context</text>
    <circle cx="772" cy="320" r="4" fill="#13a58b"/><text x="788" y="325" fill="#374356" font-size="15">Analyst decisions and audited reveal</text>
  </g>

  <line x1="540" y1="260" x2="588" y2="260" stroke="#8794a7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="692" y1="260" x2="734" y2="260" stroke="#8794a7" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="592" y="218" width="96" height="84" rx="7" fill="#fff9ed" stroke="#e8cb91"/>
  <text x="640" y="248" text-anchor="middle" fill="#9a6508" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing=".7">REPORTING</text>
  <text x="640" y="267" text-anchor="middle" fill="#9a6508" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing=".7">POLICY</text>
  <text x="640" y="285" text-anchor="middle" fill="#5b6678" font-family="Arial,sans-serif" font-size="10">decision</text>

  <text x="40" y="410" fill="#374356" font-family="Arial,sans-serif" font-size="13" font-weight="700">Reporting note</text>
  <text x="40" y="432" fill="#5b6678" font-family="Arial,sans-serif" font-size="12">A report may include matched-value evidence. Raw values are encrypted at rest, omitted from ordinary finding lists, and revealed through a separate audited action.</text>
</svg>
