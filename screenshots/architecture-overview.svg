<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Triscaler public architecture overview</title>
  <desc id="desc">A conceptual four-stage flow from supported endpoint sources through local evaluation and a reporting policy to analyst review.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#8794a7"/>
    </marker>
  </defs>
  <rect width="1280" height="520" fill="#f7f9fc"/>
  <text x="40" y="46" fill="#084da8" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">PUBLIC ARCHITECTURE OVERVIEW</text>
  <text x="40" y="86" fill="#0d1526" font-family="Arial,sans-serif" font-size="30" font-weight="700">From endpoint discovery to analyst action</text>
  <text x="40" y="116" fill="#5b6678" font-family="Arial,sans-serif" font-size="16">A product-level view of the boundaries and responsibilities.</text>

  <g font-family="Arial,sans-serif">
    <rect x="40" y="158" width="270" height="260" rx="8" fill="#ffffff" stroke="#dce4ee"/>
    <rect x="40" y="158" width="270" height="6" rx="3" fill="#0b75ff"/>
    <text x="60" y="194" fill="#084da8" font-size="11" font-weight="700" letter-spacing="1.3">ON THE ENDPOINT</text>
    <text x="60" y="229" fill="#0d1526" font-size="21" font-weight="700">Supported sources</text>
    <text x="60" y="274" fill="#374356" font-size="15">Files and local stores</text>
    <text x="60" y="306" fill="#374356" font-size="15">Supported browser events</text>
    <text x="60" y="338" fill="#374356" font-size="15">User's local report</text>
    <line x1="60" y1="366" x2="290" y2="366" stroke="#e6ebf2"/>
    <text x="60" y="392" fill="#5b6678" font-size="12">Coverage depends on the source.</text>

    <rect x="344" y="158" width="270" height="260" rx="8" fill="#ffffff" stroke="#dce4ee"/>
    <rect x="344" y="158" width="270" height="6" rx="3" fill="#13a58b"/>
    <text x="364" y="194" fill="#087c69" font-size="11" font-weight="700" letter-spacing="1.3">LOCAL PROCESSING</text>
    <text x="364" y="229" fill="#0d1526" font-size="21" font-weight="700">Local evaluation</text>
    <text x="364" y="274" fill="#374356" font-size="15">Content evaluated on device</text>
    <text x="364" y="306" fill="#374356" font-size="15">Local semantic assistance</text>
    <text x="364" y="338" fill="#374356" font-size="15">Source and account context</text>
    <line x1="364" y1="366" x2="594" y2="366" stroke="#e6ebf2"/>
    <text x="364" y="392" fill="#5b6678" font-size="12">Scanning does not call cloud AI.</text>

    <rect x="648" y="158" width="270" height="260" rx="8" fill="#ffffff" stroke="#dce4ee"/>
    <rect x="648" y="158" width="270" height="6" rx="3" fill="#dc9a24"/>
    <text x="668" y="194" fill="#9a6508" font-size="11" font-weight="700" letter-spacing="1.3">REPORTING CONTROL</text>
    <text x="668" y="229" fill="#0d1526" font-size="21" font-weight="700">Policy decision</text>
    <text x="668" y="274" fill="#374356" font-size="15">Selected findings only</text>
    <text x="668" y="306" fill="#374356" font-size="15">Local scan remains separate</text>
    <text x="668" y="338" fill="#374356" font-size="15">Evidence may be included</text>
    <line x1="668" y1="366" x2="898" y2="366" stroke="#e6ebf2"/>
    <text x="668" y="392" fill="#5b6678" font-size="12">Reporting is policy-controlled.</text>

    <rect x="952" y="158" width="270" height="260" rx="8" fill="#ffffff" stroke="#dce4ee"/>
    <rect x="952" y="158" width="270" height="6" rx="3" fill="#3859a8"/>
    <text x="972" y="194" fill="#3859a8" font-size="11" font-weight="700" letter-spacing="1.3">CENTRAL CONSOLE</text>
    <text x="972" y="229" fill="#0d1526" font-size="21" font-weight="700">Analyst workflow</text>
    <text x="972" y="274" fill="#374356" font-size="15">Review and assign</text>
    <text x="972" y="306" fill="#374356" font-size="15">Record decisions</text>
    <text x="972" y="338" fill="#374356" font-size="15">Track exposure history</text>
    <line x1="972" y1="366" x2="1202" y2="366" stroke="#e6ebf2"/>
    <text x="972" y="392" fill="#5b6678" font-size="12">A person remains accountable.</text>
  </g>

  <line x1="312" y1="288" x2="336" y2="288" stroke="#8794a7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="616" y1="288" x2="640" y2="288" stroke="#8794a7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="920" y1="288" x2="944" y2="288" stroke="#8794a7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="40" y="474" fill="#5b6678" font-family="Arial,sans-serif" font-size="13">Public view: data boundaries and responsibilities only, not a component inventory or deployment blueprint.</text>
  <text x="40" y="496" fill="#8892a4" font-family="Arial,sans-serif" font-size="12">A report may contain matched-value evidence when allowed by reporting policy.</text>
</svg>
