<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1420" viewBox="0 0 390 1420" role="img" aria-labelledby="title desc">
  <title id="title">Triscaler combined detection and planned quarantine sequence for mobile</title>
  <desc id="desc">The current product checks a supported source locally and reports according to policy. One planned response flow shows analyst approval, signed server authorization, local hash recheck, encrypted quarantine, audit receipt and restore. Quarantine does not resolve rotation.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3f8ff"/><stop offset="1" stop-color="#f4faf7"/></linearGradient>
  </defs>
  <rect width="390" height="1420" rx="14" fill="url(#paper)"/>
  <g font-family="Arial,sans-serif">
    <text x="22" y="34" fill="#075ebd" font-size="11" font-weight="700" letter-spacing="1.2">ONE SEQUENCE · CURRENT + PLANNED</text>
    <text x="22" y="66" fill="#102039" font-size="21" font-weight="700">Detect, contain, recover</text>

    <rect x="18" y="96" width="354" height="360" rx="10" fill="#fff" stroke="#dce6f0"/>
    <text x="38" y="128" fill="#075ebd" font-size="11" font-weight="700" letter-spacing="1">CURRENT · DETECTION AND REPORT</text>
    <line x1="52" y1="169" x2="52" y2="410" stroke="#c5d4e4" stroke-width="1.5"/>
    <circle cx="52" cy="176" r="12" fill="#f2f7fd" stroke="#9dbfe5"/>
    <text x="52" y="180" text-anchor="middle" fill="#075ebd" font-size="9" font-weight="700">01</text>
    <text x="76" y="173" fill="#102039" font-size="13" font-weight="700">Supported source</text>
    <text x="76" y="193" fill="#58677d" font-size="11">File, browser action or AI chat.</text>
    <circle cx="52" cy="239" r="12" fill="#f2f7fd" stroke="#9dbfe5"/>
    <text x="52" y="243" text-anchor="middle" fill="#075ebd" font-size="9" font-weight="700">02</text>
    <text x="76" y="236" fill="#102039" font-size="13" font-weight="700">Evaluate locally</text>
    <text x="76" y="256" fill="#58677d" font-size="11">AI adds context; evidence must agree.</text>
    <circle cx="52" cy="302" r="12" fill="#fff8e9" stroke="#dfc37f"/>
    <text x="52" y="306" text-anchor="middle" fill="#94630c" font-size="9" font-weight="700">03</text>
    <text x="76" y="299" fill="#102039" font-size="13" font-weight="700">Apply reporting policy</text>
    <text x="76" y="319" fill="#58677d" font-size="11">Keep local or send a signed report.</text>
    <circle cx="52" cy="365" r="12" fill="#edf7f4" stroke="#acd9ca"/>
    <text x="52" y="369" text-anchor="middle" fill="#087763" font-size="9" font-weight="700">04</text>
    <text x="76" y="362" fill="#102039" font-size="13" font-weight="700">Server and analyst review</text>
    <text x="76" y="382" fill="#58677d" font-size="11">Verify, correlate and record a decision.</text>

    <rect x="18" y="480" width="354" height="660" rx="10" fill="#fffaf0" stroke="#d8b15c" stroke-width="1.3" stroke-dasharray="6 5"/>
    <text x="38" y="512" fill="#94630c" font-size="11" font-weight="700" letter-spacing="1">PLANNED · APPROVAL-GATED QUARANTINE</text>
    <text x="38" y="534" fill="#74674b" font-size="11">High-confidence local file only; dry-run first.</text>
    <line x1="52" y1="574" x2="52" y2="1012" stroke="#d8c99e" stroke-width="1.5"/>

    <circle cx="52" cy="582" r="12" fill="#fff7e6" stroke="#dfc37f"/>
    <text x="52" y="586" text-anchor="middle" fill="#94630c" font-size="9" font-weight="700">05</text>
    <text x="76" y="579" fill="#102039" font-size="13" font-weight="700">Analyst approves action</text>
    <text x="76" y="599" fill="#74674b" font-size="11">Preview the file and reason first.</text>

    <circle cx="52" cy="658" r="12" fill="#fff7e6" stroke="#dfc37f"/>
    <text x="52" y="662" text-anchor="middle" fill="#94630c" font-size="9" font-weight="700">06</text>
    <text x="76" y="655" fill="#102039" font-size="13" font-weight="700">Server signs scoped request</text>
    <text x="76" y="675" fill="#74674b" font-size="11">Device · finding · expected hash · expiry.</text>

    <circle cx="52" cy="734" r="12" fill="#eaf3ff" stroke="#9dbfe5"/>
    <text x="52" y="738" text-anchor="middle" fill="#075ebd" font-size="9" font-weight="700">07</text>
    <text x="76" y="731" fill="#102039" font-size="13" font-weight="700">Agent verifies and rechecks file</text>
    <text x="76" y="751" fill="#74674b" font-size="11">Changed or stale files are not moved.</text>

    <circle cx="52" cy="810" r="12" fill="#eaf3ff" stroke="#9dbfe5"/>
    <text x="52" y="814" text-anchor="middle" fill="#075ebd" font-size="9" font-weight="700">08</text>
    <text x="76" y="807" fill="#102039" font-size="13" font-weight="700">Encrypt and quarantine locally</text>
    <text x="76" y="827" fill="#74674b" font-size="11">Keep origin and restore details; never</text>
    <text x="76" y="844" fill="#74674b" font-size="11">upload the quarantined file.</text>

    <circle cx="52" cy="904" r="12" fill="#eaf3ff" stroke="#9dbfe5"/>
    <text x="52" y="908" text-anchor="middle" fill="#075ebd" font-size="9" font-weight="700">09</text>
    <text x="76" y="901" fill="#102039" font-size="13" font-weight="700">Send signed action receipt</text>
    <text x="76" y="921" fill="#74674b" font-size="11">Server records the result for audit.</text>

    <circle cx="52" cy="980" r="12" fill="#edf7f4" stroke="#acd9ca"/>
    <text x="52" y="984" text-anchor="middle" fill="#087763" font-size="9" font-weight="700">10</text>
    <text x="76" y="977" fill="#102039" font-size="13" font-weight="700">Restore safely or verify rotation</text>
    <text x="76" y="997" fill="#74674b" font-size="11">Check integrity and path conflicts first.</text>

    <rect x="18" y="1164" width="354" height="214" rx="10" fill="#edf5ff" stroke="#cbdcf0"/>
    <text x="38" y="1198" fill="#075ebd" font-size="11" font-weight="700" letter-spacing="1">QUARANTINE IS NOT RESOLUTION</text>
    <text x="38" y="1231" fill="#102039" font-size="14" font-weight="700">The finding stays open.</text>
    <text x="38" y="1255" fill="#58677d" font-size="12">Moving a file does not rotate a credential.</text>
    <line x1="38" y1="1277" x2="352" y2="1277" stroke="#d7e2ee"/>
    <text x="38" y="1306" fill="#58677d" font-size="11">Only independent rotation verification or an</text>
    <text x="38" y="1323" fill="#58677d" font-size="11">analyst decision can resolve the exposure.</text>
    <text x="38" y="1354" fill="#58677d" font-size="11">This response flow is planned, not shipped.</text>
  </g>
</svg>
