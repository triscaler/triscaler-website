<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220" role="img" aria-labelledby="title desc">
  <title id="title">Triscaler sequence from detection to planned remediation and quarantine</title>
  <desc id="desc">One diagram combines current local detection and policy-controlled reporting with planned remediation. An analyst approves a scoped request, the server signs it, the Mac agent rechecks the local file hash, encrypts an eligible file in a local quarantine vault, and reports a signed receipt. Restore is available. Quarantine does not resolve or rotate the credential.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3f8ff"/><stop offset="1" stop-color="#f4faf7"/></linearGradient>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3976c5"/></marker>
    <marker id="grayArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71839c"/></marker>
    <marker id="amberArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b58027"/></marker>
  </defs>
  <rect width="1200" height="1220" fill="url(#paper)"/>
  <g font-family="Arial,sans-serif">
    <text x="42" y="46" fill="#075ebd" font-size="14" font-weight="700" letter-spacing="1.7">ONE SEQUENCE · CURRENT + PLANNED</text>
    <text x="42" y="86" fill="#102039" font-size="30" font-weight="700">Detect, contain, restore, verify</text>
    <text x="42" y="114" fill="#58677d" font-size="16">Current product is blue. Planned response steps are amber and not shipped.</text>

    <rect x="34" y="143" width="1132" height="342" rx="14" fill="#fff" fill-opacity=".86" stroke="#dce6f0"/>
    <text x="56" y="175" fill="#075ebd" font-size="13" font-weight="700" letter-spacing="1.2">CURRENT · LOCAL CHECK AND REPORT</text>
    <rect x="52" y="198" width="170" height="58" rx="9" fill="#fff" stroke="#cfd9e6"/>
    <text x="137" y="222" text-anchor="middle" fill="#102039" font-size="15" font-weight="700">Source</text>
    <text x="137" y="242" text-anchor="middle" fill="#66758a" font-size="12">file · browser · AI chat</text>
    <rect x="280" y="198" width="190" height="58" rx="9" fill="#eaf3ff" stroke="#b9d5f7"/>
    <text x="375" y="222" text-anchor="middle" fill="#075ebd" font-size="15" font-weight="700">Mac agent</text>
    <text x="375" y="242" text-anchor="middle" fill="#58677d" font-size="12">local detection + AI context</text>
    <rect x="530" y="198" width="190" height="58" rx="9" fill="#fff8e9" stroke="#e7d29c"/>
    <text x="625" y="222" text-anchor="middle" fill="#94630c" font-size="15" font-weight="700">Reporting policy</text>
    <text x="625" y="242" text-anchor="middle" fill="#74674b" font-size="12">send or keep local</text>
    <rect x="780" y="198" width="180" height="58" rx="9" fill="#edf7f4" stroke="#c8e4da"/>
    <text x="870" y="222" text-anchor="middle" fill="#087763" font-size="15" font-weight="700">Server</text>
    <text x="870" y="242" text-anchor="middle" fill="#58677d" font-size="12">verify + correlate</text>
    <rect x="1010" y="198" width="150" height="58" rx="9" fill="#fff" stroke="#cfd9e6"/>
    <text x="1085" y="222" text-anchor="middle" fill="#102039" font-size="15" font-weight="700">Analyst</text>
    <text x="1085" y="242" text-anchor="middle" fill="#66758a" font-size="12">review + decide</text>
    <g stroke="#bfccd9" stroke-width="1.3" stroke-dasharray="5 7">
      <line x1="137" y1="256" x2="137" y2="448"/><line x1="375" y1="256" x2="375" y2="448"/>
      <line x1="625" y1="256" x2="625" y2="448"/><line x1="870" y1="256" x2="870" y2="448"/>
      <line x1="1085" y1="256" x2="1085" y2="448"/>
    </g>
    <line x1="147" y1="294" x2="365" y2="294" stroke="#3976c5" stroke-width="2.2" marker-end="url(#blueArrow)"/>
    <rect x="185" y="267" width="145" height="21" rx="5" fill="#f2f7fd"/>
    <text x="257" y="282" text-anchor="middle" fill="#18334f" font-size="12">1 · supported event</text>
    <rect x="288" y="312" width="174" height="39" rx="6" fill="#f2f7fd" stroke="#d9e7f6"/>
    <text x="375" y="329" text-anchor="middle" fill="#18334f" font-size="12" font-weight="700">2 · evaluate locally</text>
    <text x="375" y="344" text-anchor="middle" fill="#58677d" font-size="11">AI supports; evidence decides</text>
    <line x1="385" y1="382" x2="615" y2="382" stroke="#3976c5" stroke-width="2.2" marker-end="url(#blueArrow)"/>
    <rect x="425" y="355" width="150" height="21" rx="5" fill="#f2f7fd"/>
    <text x="500" y="370" text-anchor="middle" fill="#18334f" font-size="12">3 · finding candidate</text>
    <line x1="635" y1="418" x2="860" y2="418" stroke="#3976c5" stroke-width="2.2" marker-end="url(#blueArrow)"/>
    <rect x="673" y="391" width="150" height="21" rx="5" fill="#f2f7fd"/>
    <text x="748" y="406" text-anchor="middle" fill="#18334f" font-size="12">4 · signed report if allowed</text>
    <line x1="880" y1="454" x2="1075" y2="454" stroke="#71839c" stroke-width="1.8" marker-end="url(#grayArrow)"/>
    <rect x="909" y="427" width="136" height="21" rx="5" fill="#f7f8fa"/>
    <text x="977" y="442" text-anchor="middle" fill="#536278" font-size="12">5 · review finding</text>

    <rect x="34" y="510" width="1132" height="500" rx="14" fill="#fffaf0" stroke="#d8b15c" stroke-width="1.5" stroke-dasharray="8 6"/>
    <text x="56" y="543" fill="#94630c" font-size="13" font-weight="700" letter-spacing="1.2">PLANNED · APPROVAL-GATED REMEDIATION AND QUARANTINE</text>
    <text x="56" y="568" fill="#74674b" font-size="13">High-confidence local file only · dry-run first · manual approval before action</text>
    <rect x="54" y="590" width="160" height="58" rx="8" fill="#fff" stroke="#dfc37f"/>
    <text x="134" y="614" text-anchor="middle" fill="#795b24" font-size="14" font-weight="700">Analyst</text>
    <text x="134" y="633" text-anchor="middle" fill="#74674b" font-size="11">approve request</text>
    <rect x="280" y="590" width="180" height="58" rx="8" fill="#fff" stroke="#dfc37f"/>
    <text x="370" y="614" text-anchor="middle" fill="#795b24" font-size="14" font-weight="700">Server</text>
    <text x="370" y="633" text-anchor="middle" fill="#74674b" font-size="11">policy + audit</text>
    <rect x="530" y="590" width="185" height="58" rx="8" fill="#fff" stroke="#dfc37f"/>
    <text x="622" y="614" text-anchor="middle" fill="#795b24" font-size="14" font-weight="700">Mac agent</text>
    <text x="622" y="633" text-anchor="middle" fill="#74674b" font-size="11">verify + execute</text>
    <rect x="785" y="590" width="150" height="58" rx="8" fill="#fff" stroke="#dfc37f"/>
    <text x="860" y="614" text-anchor="middle" fill="#795b24" font-size="14" font-weight="700">Source file</text>
    <text x="860" y="633" text-anchor="middle" fill="#74674b" font-size="11">local hash check</text>
    <rect x="1005" y="590" width="140" height="58" rx="8" fill="#fff" stroke="#dfc37f"/>
    <text x="1075" y="614" text-anchor="middle" fill="#795b24" font-size="13" font-weight="700">Local vault</text>
    <text x="1075" y="633" text-anchor="middle" fill="#74674b" font-size="11">encrypted file</text>
    <g stroke="#d9c99f" stroke-width="1.2" stroke-dasharray="5 7">
      <line x1="134" y1="648" x2="134" y2="964"/><line x1="370" y1="648" x2="370" y2="964"/>
      <line x1="622" y1="648" x2="622" y2="964"/><line x1="860" y1="648" x2="860" y2="964"/>
      <line x1="1075" y1="648" x2="1075" y2="964"/>
    </g>
    <line x1="144" y1="688" x2="360" y2="688" stroke="#b58027" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#amberArrow)"/>
    <rect x="170" y="661" width="151" height="21" rx="5" fill="#fffaf0"/>
    <text x="245" y="676" text-anchor="middle" fill="#795b24" font-size="11">6 · request quarantine</text>
    <line x1="380" y1="732" x2="612" y2="732" stroke="#b58027" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#amberArrow)"/>
    <rect x="396" y="705" width="200" height="21" rx="5" fill="#fffaf0"/>
    <text x="496" y="720" text-anchor="middle" fill="#795b24" font-size="11">7 · signed scope + hash + expiry</text>
    <line x1="632" y1="776" x2="850" y2="776" stroke="#b58027" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#amberArrow)"/>
    <rect x="657" y="749" width="170" height="21" rx="5" fill="#fffaf0"/>
    <text x="742" y="764" text-anchor="middle" fill="#795b24" font-size="11">8 · recheck exact file hash</text>
    <line x1="850" y1="820" x2="632" y2="820" stroke="#b58027" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#amberArrow)"/>
    <rect x="652" y="826" width="180" height="21" rx="5" fill="#fffaf0"/>
    <text x="742" y="841" text-anchor="middle" fill="#795b24" font-size="11">9 · mismatch: reject action</text>
    <line x1="632" y1="876" x2="1065" y2="876" stroke="#b58027" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#amberArrow)"/>
    <rect x="714" y="849" width="250" height="21" rx="5" fill="#fffaf0"/>
    <text x="839" y="864" text-anchor="middle" fill="#795b24" font-size="11">10 · encrypt + quarantine locally</text>
    <text x="839" y="897" text-anchor="middle" fill="#74674b" font-size="10">preserve origin + restore details; no file upload</text>
    <line x1="612" y1="920" x2="380" y2="920" stroke="#b58027" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#amberArrow)"/>
    <rect x="416" y="893" width="164" height="21" rx="5" fill="#fffaf0"/>
    <text x="498" y="908" text-anchor="middle" fill="#795b24" font-size="11">11 · signed action receipt</text>
    <line x1="360" y1="960" x2="144" y2="960" stroke="#b58027" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#amberArrow)"/>
    <rect x="166" y="933" width="170" height="21" rx="5" fill="#fffaf0"/>
    <text x="251" y="948" text-anchor="middle" fill="#795b24" font-size="11">12 · audit + restore option</text>

    <rect x="34" y="1030" width="1132" height="146" rx="12" fill="#edf5ff" stroke="#cbdcf0"/>
    <text x="56" y="1065" fill="#075ebd" font-size="12" font-weight="700" letter-spacing="1">QUARANTINE IS NOT RESOLUTION</text>
    <text x="56" y="1097" fill="#102039" font-size="16" font-weight="700">The finding stays open until rotation is verified or an analyst resolves it.</text>
    <text x="56" y="1125" fill="#58677d" font-size="13">Restore checks integrity and path conflicts. Quarantine contents never leave the endpoint.</text>
    <text x="56" y="1148" fill="#58677d" font-size="13">This response flow is planned; current controls are limited to analyst workflows.</text>
  </g>
</svg>
